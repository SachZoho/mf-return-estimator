name: MF Alert Checker

on:
  schedule:
    # Run every 5 minutes (GitHub Actions minimum interval for free tier)
    - cron: '*/5 * * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir yfinance beautifulsoup4 requests pandas plotly

      - name: Run alert checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python alert_checker.py
